spring:
  application:
    name: candidates
  datasource:
    url: jdbc:h2:file:./data/candidatesdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"